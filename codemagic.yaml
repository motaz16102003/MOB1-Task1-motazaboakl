
workflows:
  android-build:
    name: Android Practice Project
    max_build_duration: 30
    instance_type: linux
    environment:
      android_signing:
        - keystore_reference
      vars:
        PROJECT_DIR: "BirthdayCard"
      java: 17
    scripts:
      - name: Build selected Android project
        script: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"


workflows:
  android-build:
    name: Birthday Card APK
    max_build_duration: 30
    instance_type: linux
    environment:
      java: 17
    scripts:
      - name: Build BirthdayCard debug APK
        script: |
          cd BirthdayCard
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - BirthdayCard/app/build/outputs/apk/debug/*.apk

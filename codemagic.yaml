
workflows:
  android-build:
    name: Birthday Card APK
    max_build_duration: 30
    
    environment:
      java: 17
  
    scripts:
      - name: Build BirthdayCard debug APK
        script: |
          cd BirthdayCard
          gradle assembleDebug

    artifacts:
      - BirthdayCard/app/build/outputs/apk/debug/*.apk
